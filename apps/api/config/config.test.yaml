server:
  name: demo
  port: 8099
  env: dev

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    logger_type: zap
    service: demo
    module: default
    level: info
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  gorm:
    logger_type: zap
    service: demo
    module: gorm
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  redis:
    logger_type: zap
    service: demo
    module: redis
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId

trace:
  enable: false
  service_version: ""
  sampler: traceidratio
  trace_id_ratio: 1.0
  otlp:
    endpoint: "127.0.0.1:4317"
    insecure: true
    timeout: 10s


db_configs:
  # 目标库为 PostgreSQL（model tag 与 backend/scripts/sql/table_init.sql 都按 PG 写）
  - url: "postgres://postgres:123456@127.0.0.1:5432/demo?sslmode=disable&TimeZone=Asia/Shanghai"
    service: demo
    # 连接池：显式配置，避免默认无上限导致连接耗尽（golib dbgorm 按 >0 才下发）。
    max_idle_conns: 10
    max_open_conns: 100
    conn_max_lifetime: 1h

redis_config:
  service: demo
  addr: 127.0.0.1:6379
  # 本地 dev 的 Redis 容器默认未设 requirepass，置空即可直连。
  # 注意：go-redis 在配置了密码但服务端未设密码时，AUTH 会返回
  # "ERR AUTH <password> called without any password configured"，启动即失败。
  # 若你的 Redis 设了密码，改这里，或用 APP_CONFIG_PATH 指向本地覆盖配置。
  password: ""
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

file_storage:
  driver: local
  bucket: demo
  storage:
    base_dir: ../../../.local/storage-test
    # 必须指向 ginupload 注册的对象直传路由（/v1/demo/objects），
    # local driver 按 base_url/{bucket}/{key} 拼预签名 URL
    base_url: http://127.0.0.1:8099/v1/demo/objects
    sign_secret: demo-sign-secret

cron:
  enable_lock: true       # 是否启用分布式锁（多实例互斥）
  lock_ttl: 60s           # 分布式锁租期

async:
  concurrency: 10             # 执行 worker 并发度（<=0 用默认 10）

# 可选接入 ark-iam（两态 mode）。默认 disabled：不初始化 IAM、不建表、不挂 /iam/* 路由，
# 业务鉴权回落到固定 dev 身份（仅 dev）。
#   mode: disabled  不接入（默认，零副作用）
#   mode: rp        对接外部 ark-iam（OIDC 本地验签，读 issuer/jwks_url/audience），不建库、不挂路由
# 说明：内嵌 OP（mode: op）已下线；需本地自举 IAM 请使用 ark-iam 仓库（github.com/morehao/ark-iam）。
iam:
  mode: disabled              # 接入形态：disabled（默认，零副作用）| rp（对接外部 ark-iam 本地验签）
  # rp 形态：外部 ark-iam 的 issuer（必填，用于校验 token 的 iss）。
  issuer: ""                  # 例：https://iam.example.com/oidc
  jwks_url: ""                # rp 形态的 JWKS 端点，空则由 issuer 走 discovery 推导
  audience: ""                # rp 形态本应用 client_id，用于 aud 校验（建议必填，防其它应用 token 被误接受）
