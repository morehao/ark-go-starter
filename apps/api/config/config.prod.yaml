server:
  name: demo
  port: 8099
  env: prod

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    logger_type: zap
    service: demo
    module: default
    level: info
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  gorm:
    logger_type: zap
    service: demo
    module: gorm
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  redis:
    logger_type: zap
    service: demo
    module: redis
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId


db_configs:
  # 目标库为 PostgreSQL（model tag 与 backend/scripts/sql/table_init.sql 都按 PG 写）
  - url: "postgres://postgres:123456@127.0.0.1:5432/demo?sslmode=disable&TimeZone=Asia/Shanghai"
    service: demo

redis_config:
  service: demo
  addr: 127.0.0.1:6379
  password: 123456
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

file_storage:
  driver: local
  bucket: demo
  storage:
    base_dir: /app/.local/storage
    # 必须指向 ginupload 注册的对象直传路由（/v1/demo/objects），
    # local driver 按 base_url/{bucket}/{key} 拼预签名 URL
    base_url: http://127.0.0.1:8099/v1/demo/objects
    sign_secret: demo-sign-secret

# 可选接入 ark-iam（三态 mode）。
#   mode: disabled  不接入（默认，零副作用）
#   mode: op        本进程内嵌 OIDC Provider：建库、挂 /iam/*、签发/验签
#   mode: rp        对接外部 ark-iam：仅本地验签（读 jwks_url/audience），不建库、不挂路由
# 生产环境（env: prod）当 mode: op 时务必显式配置以下安全项，否则会 fail-closed 启动失败：
#   - signing_key：OIDC 签名私钥 PEM（RSA/EC），用于签发 id_token / 验签；
#   - encryption_key：会话/令牌加密密钥（≥32 字节随机串）；
#   - cookie_secure：SSO 会话 cookie 的 Secure 标志，HTTPS 生产必须 true；
#   - issuer：建议显式设为对外域名（https）。
# 下方占位值务必替换为真实密钥，切勿把真实私钥提交入库（建议改用环境变量/密钥管理注入）。
# 兼容旧开关：mode 留空且 enable: true 时按 op 处理（enable 已废弃，建议改用 mode）。
iam:
  mode: disabled              # 接入形态：disabled（默认）| op | rp
  enable: false               # 旧二态开关（兼容）：mode 为空且为 true 时按 op
  prefix: /iam                # IAM 挂载路由前缀（op 须与前端 basePath 一致）
  dsn: ""                     # IAM 数据库 DSN（op），空则复用 db_configs 第一个库
  redis_addr: ""              # IAM Redis 地址（op），空则复用 redis_config
  redis_password: ""          # IAM Redis 密码（op），空则复用 redis_config
  issuer: ""                  # OIDC issuer：op 空则按端口推导；rp 为外部 ark-iam 的 issuer；生产建议显式 https 域名
  jwks_url: ""                # rp 形态的 JWKS 端点，空则按 issuer 推导
  audience: ""                # rp 形态需校验的 token aud
  signing_key: "REPLACE_WITH_PEM_PRIVATE_KEY"   # 签名私钥 PEM（op），非 dev 必填
  encryption_key: "REPLACE_WITH_32_BYTE_RANDOM_SECRET"  # 加密密钥（op），非 dev 必填
  cookie_secure: true         # 生产（HTTPS）必须 true（op）
