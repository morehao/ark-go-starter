server:
  name: demo
  port: 8099
  env: prod

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    logger_type: zap
    service: demo
    module: default
    level: info
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  gorm:
    logger_type: zap
    service: demo
    module: gorm
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  redis:
    logger_type: zap
    service: demo
    module: redis
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId


db_configs:
  # 目标库为 PostgreSQL（model tag 与 backend/scripts/sql/table_init.sql 都按 PG 写）
  - url: "postgres://postgres:123456@127.0.0.1:5432/demo?sslmode=disable&TimeZone=Asia/Shanghai"
    service: demo

redis_config:
  service: demo
  addr: 127.0.0.1:6379
  password: 123456
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

# 异步任务（golib/task/gasync 任务中心）配置：执行 worker 并发度。
# v1.36.3 起 gasync 改为 DB 认领模型，不再依赖 Redis 队列，故不再需要 redis_addr。
async:
  concurrency: 10              # 执行 worker 并发度（<=0 用默认 10）

file_storage:
  driver: local
  bucket: demo
  storage:
    base_dir: /app/.local/storage
    # 必须指向 ginupload 注册的对象直传路由（/v1/demo/objects），
    # local driver 按 base_url/{bucket}/{key} 拼预签名 URL
    base_url: http://127.0.0.1:8099/v1/demo/objects
    sign_secret: demo-sign-secret

# 可选接入 ark-iam（两态 mode）。
#   mode: disabled  不接入（默认，零副作用）
#   mode: rp        对接外部 ark-iam（OIDC 本地验签，读 issuer/jwks_url/audience），不建库、不挂路由
# 生产建议：issuer 显式设为外部 OP 的 https 域名；audience 填本应用 client_id。
# 说明：内嵌 OP（mode: op）已下线；需本地自举 IAM 请使用 ark-iam 仓库（github.com/morehao/ark-iam）。
iam:
  mode: disabled              # 接入形态：disabled（默认，零副作用）| rp（对接外部 ark-iam 本地验签）
  # rp 形态：外部 ark-iam 的 issuer（必填，用于校验 token 的 iss）。
  issuer: ""                  # 例：https://iam.example.com/oidc
  jwks_url: ""                # rp 形态的 JWKS 端点，空则由 issuer 走 discovery 推导
  audience: ""                # rp 形态本应用 client_id，用于 aud 校验（建议必填，防其它应用 token 被误接受）
