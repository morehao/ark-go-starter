name: CI

# ─────────────────────────────────────────────────────────────────────────────
# 分层门禁（2026-11 定稿，方案 2）：
#
#   PR 门禁 = 快检，按变更范围只跑相关 job（无关 job 主动 skip）：
#     - 文档/纯 md          → changes 判定后全部 skip，~5s
#     - 前端改动            → Frontend（eslint + nx affected typecheck）
#     - Go 改动             → Lint（gofmt + golangci-lint）+ Test（单元测试，无 DB/无 -race）
#     - 依赖变更            → 追加 Security（govulncheck）
#     - 契约面变更          → 追加 contracts-verify（在 Frontend 内条件执行）
#   主干 = 深检，push 到主干跑 Deep test（integration + -race）+ 上述全部；
#   另加每周定时全量扫描一次（schedule 事件同样视为"全量"）。
#
# 为什么不再追求更多缓存：warm run 实测 53s 中约 33s 是"起环境"
#   （PG/Redis 16s + 拉 Go 工具链 9s + restore 缓存 8s），真正测试只有 8s。
#   所以降耗的唯一有效杠杆是"不跑无关 job"，而不是继续堆缓存。
#
# 机制依据（2026-11-13 实测 PR #99）：required check 被 skip 时结论为 SKIPPED，
#   GitHub 给出 mergeStateStatus=CLEAN/MERGEABLE —— 不阻塞合并，故按范围跳过是安全的。
#
# 缓存：actions/setup-go 内置缓存命中即冻结（残缺快照永久复用），改用显式 actions/cache；
#   PR 侧只 restore，save 只在主干 push / 手动 dispatch，避免每 PR 各写一份打爆 10GB 配额。
#   GO_CACHE_VERSION 为手动失效开关（+1 即重建）。
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]
  # merge queue 预留：仓库开启 merge queue 后由队列触发，无需再改本文件。
  merge_group:
  # 每周一次全量（含 govulncheck 与深层测试），兜住"依赖/代码漏洞只在时间维度暴露"的风险。
  schedule:
    - cron: "0 2 * * 1"
  # 手动触发：默认只跑常规门禁；勾选 run_e2e 才跑 E2E。
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "同时运行 E2E（后端真端口 + Playwright，约 10-25 分钟）"
        type: boolean
        default: false

permissions:
  contents: read

# 同一 PR 连推多个 commit 时取消旧 run；主干 push 不取消（保留完整记录）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  OAPI_CODEGEN_VERSION: v2.4.1
  GO_CACHE_VERSION: v1

jobs:
  # ── 变更范围判定：决定哪些 job 需要跑 ──────────────────────────────────────
  # 非 PR 事件（push / merge_group / schedule / dispatch）一律全量，主干永远是全量验证。
  # 判定失败或无法取基线时，同样按全量执行（fail-safe，绝不因判定错误放行）。
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.detect.outputs.go }}
      frontend: ${{ steps.detect.outputs.frontend }}
      contracts: ${{ steps.detect.outputs.contracts }}
      deps: ${{ steps.detect.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Detect changed areas
        id: detect
        run: |
          set -uo pipefail
          go=false; fe=false; ct=false; deps=false
          all() { go=true; fe=true; ct=true; deps=true; }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            all; echo "非 PR 事件（${{ github.event_name }}）：全量执行"
          else
            base="${{ github.base_ref }}"
            if ! git fetch --no-tags --depth=1 origin "$base" >/dev/null 2>&1; then
              all; echo "无法获取基线 origin/$base：全量执行"
            else
              changed=$(git diff --name-only FETCH_HEAD HEAD 2>/dev/null || true)
              if [ -z "$changed" ]; then
                all; echo "变更文件为空：全量执行"
              else
                while IFS= read -r f; do
                  matched=true
                  case "$f" in
                    # 文档/过程产物：不需要任何门禁
                    *.md|docs/*|.dsh/*|.history/*|.idea/*|LICENSE) ;;
                    # 依赖文件必须排在目录通配之前，否则会被 apps/api/* / pkg/* 先吃掉
                    apps/api/go.mod|apps/api/go.sum|pkg/go.mod|pkg/go.sum|go.work.sum) go=true; deps=true ;;
                    package.json|pnpm-lock.yaml|pnpm-workspace.yaml) fe=true; deps=true ;;
                    # 契约面：Go client + TS schema 都由 spec 派生
                    contracts/*|packages/api-client/*) go=true; fe=true; ct=true ;;
                    # Go 侧
                    apps/api/*|pkg/*) go=true ;;
                    go.work|.golangci.yml|Makefile) go=true ;;
                    # 前端侧
                    apps/web/*|packages/*) fe=true ;;
                    tsconfig.base.json|nx.json|eslint.config.mjs) fe=true ;;
                    # 未分类路径：保守全量
                    *) matched=false ;;
                  esac
                  if [ "$matched" = false ]; then
                    echo "未分类变更 $f：全量执行"
                    all
                  fi
                done <<< "$changed"
                echo "变更文件："; echo "$changed" | head -40
              fi
            fi
          fi

          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "contracts=$ct" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "判定结果：go=$go frontend=$fe contracts=$ct deps=$deps"

  # ── 前端：eslint + affected typecheck（不做产物构建） ─────────────────────
  frontend:
    name: Frontend
    needs: changes
    # changes 失败时按全量跑（fail-safe）
    if: needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Nx affected 需要 base..head 的 git 历史（计算 merge-base / 变更文件）。
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 契约校验只在真涉及契约面时跑，工具走缓存、未命中由 verify.sh 自行兜底。
      - name: Set up Go (contracts only)
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Cache oapi-codegen binary
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/cache@v4
        with:
          path: ~/go/bin/oapi-codegen
          key: oapi-codegen-${{ env.OAPI_CODEGEN_VERSION }}

      - name: Contracts verify
        if: needs.changes.outputs.contracts == 'true'
        run: make contracts-verify

      - name: Lint (ESLint)
        run: pnpm lint

      # 只跑 typecheck，不跑 build：build 产物在门禁里无人消费；
      # packages/{ui,types,api,api-client} 的 build 与 typecheck 命令本就完全相同。
      - name: Affected typecheck (Nx, TS only)
        run: |
          base="${{ github.base_ref }}"
          if [ -n "$base" ]; then
            git fetch --no-tags origin "$base:refs/remotes/origin/$base" || true
            base="origin/$base"
          else
            base="HEAD~1"
          fi
          pnpm exec nx affected -t typecheck \
            --base="$base" --head=HEAD \
            --exclude='*,!tag:lang:ts' \
            --output-style=static

  # ── Go 静态检查：gofmt + golangci-lint（含 govet，故不再单独跑 go vet） ────
  lint:
    name: Lint
    needs: changes
    if: needs.changes.result != 'success' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}
          restore-keys: |
            go-lint-${{ env.GO_CACHE_VERSION }}-

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l apps/api pkg)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint (pkg)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: pkg
      - name: golangci-lint (apps/api)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: apps/api

      - name: Save Go cache
        if: >-
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
          && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}

  # ── PR 门禁的单测：无 DB/Redis、无 -race（拿掉固定开销 16s + race 编译） ───
  # 集成与 race 交给 deep-test（主干）。
  test:
    name: Test
    needs: changes
    if: >-
      github.event_name != 'push'
      && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}
          restore-keys: |
            go-test-${{ env.GO_CACHE_VERSION }}-
            go-lint-${{ env.GO_CACHE_VERSION }}-

      # 单元测试（不带 integration tag，故不需要 PB/Redis 服务）
      - name: Test pkg (unit)
        run: cd pkg && go test ./...
      - name: Test demo (unit)
        run: cd apps/api && go test ./...

  # ── 主干深检：integration + race（PR 门禁已移出的部分在这里闭环） ─────────
  deep-test:
    name: Deep test (integration + race)
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Restore Go cache (race flavor)
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}
          restore-keys: |
            go-test-${{ env.GO_CACHE_VERSION }}-
            go-lint-${{ env.GO_CACHE_VERSION }}-

      - name: Init PostgreSQL schema
        env:
          PGPASSWORD: "123456"
        run: |
          psql -h 127.0.0.1 -U postgres -d demo -f apps/api/db/table_init.sql

      # 两个模块保持串行：pkg 与 apps/api 的集成用例共用同一个 demo 库，并行可能互相污染。
      - name: Test pkg (unit + integration, race)
        run: cd pkg && go test -race -tags=integration ./...
      - name: Test demo (unit + integration, race)
        run: cd apps/api && go test -race -tags=integration ./...

      - name: Save Go cache (race flavor)
        if: >-
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
          && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}

  # ── 安全扫描：只在依赖变更时进 PR 门禁（govulncheck 的发现几乎都由依赖驱动）──
  # 主干 push 与每周 schedule 会全量跑，兜住代码层调用图变化。
  security:
    name: Security (govulncheck)
    needs: changes
    if: needs.changes.result != 'success' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}
          restore-keys: |
            go-lint-${{ env.GO_CACHE_VERSION }}-

      - name: Cache govulncheck binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ env.GOVULNCHECK_VERSION }}

      - name: govulncheck
        run: |
          BIN="$HOME/go/bin/govulncheck"
          if [ ! -x "$BIN" ]; then
            BIN="$(command -v govulncheck || true)"
          fi
          if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
            GOBIN="$HOME/go/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
            BIN="$HOME/go/bin/govulncheck"
          fi
          echo "using $BIN"
          (cd pkg && "$BIN" ./...)
          (cd apps/api && "$BIN" ./...)

  # ── E2E：仅手动触发且勾选 run_e2e 时运行 ──────────────────────────────────
  e2e:
    name: E2E
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Init PostgreSQL schema
        env:
          PGPASSWORD: "123456"
        run: |
          psql -h 127.0.0.1 -U postgres -d demo -f apps/api/db/table_init.sql

      # 后端真端口 e2e：用例内部用 testsetup + Routers 自起随机端口，不依赖外部进程
      - name: Backend e2e (real port)
        run: |
          go test -tags=e2e ./apps/api/e2e/... -v -count=1

      # 前端 Playwright 需要一个真实后端在 8099：构建二进制并后台启动
      # （E2E 是手动触发的发布前验证，允许产出构建物，不属于 PR 门禁范畴）
      - name: Build & start backend for frontend e2e
        run: |
          go build -o output/build/demo ./apps/api/cmd
          APP_CONFIG_PATH="$PWD/apps/api/config/config.yaml" ./output/build/demo > /tmp/demo_be.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8099/v1/demo/health >/dev/null; then echo "backend up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/v1/demo/health

      - name: Install frontend deps
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ark-go-starter/e2e exec playwright install --with-deps chromium

      - name: Frontend lint (ESLint)
        run: pnpm lint

      - name: Frontend e2e (Playwright)
        env:
          E2E_WEB_MODE: preview
        run: |
          cd tests/e2e
          pnpm exec playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/demo_be.log || true
