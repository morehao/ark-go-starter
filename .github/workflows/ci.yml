name: CI

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]
  # E2E job 最慢（后端真端口 + Playwright，约数分钟），已从 push/PR 自动触发中移除，
  # 仅在此手动触发时运行（e2e job 带 if 门控）。日常 PR 不再等待 E2E。
  workflow_dispatch:

permissions:
  contents: read

env:
  # 与 apps/api/config/config.yaml 中 db_configs / redis_config 保持一致，
  # 供需要数据库的测试（pkg/dbclient、svcuser）使用。
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  frontend:
    name: Frontend
    # P0.5 建的前端门禁（lint + typecheck + build），P4-T3 改为 **Nx affected** 驱动：
    # 只在受影响的前端包上跑 typecheck/build，减少无关改动下的耗时。
    # 硬约束：job id `frontend` / name `Frontend` 不变；顶层 on: 触发语义不变；其它 4 个 job 名不变。
    # Nx 缓存：不启用 Nx Cloud（已定不做），用本地 .nx/cache；CI 内不跨 run 持久化，缓存命中仅 run 内。
    # 说明：前端项目当前无 `lint` target（lint 是根 `pnpm lint`，非 nx target），故 lint 保持整跑（很快）；
    #       typecheck/build 走 affected（真正的耗时项按受影响范围收敛）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Nx affected 需要 base..head 的 git 历史（计算 merge-base / 变更文件），浅克隆不够，故全量拉取。
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # 单一事实源：根 package.json 的 packageManager（pnpm@12.10.1）
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 计算 Nx affected 的 base/head：
      #  - PR：base = origin/<base_ref>（与目标分支的 merge-base 由 nx 自动求），head = HEAD
      #  - push 到主干：base = HEAD~1（对比上一个提交）
      - name: Compute Nx affected base/head
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            # fetch-depth:0 拉全历史，但 origin/<base_ref> 追踪 ref 不一定存在；显式确保它存在再用作 base
            git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE" || true
            BASE="origin/$BASE"
          else
            BASE="HEAD~1"
          fi
          echo "NX_BASE=$BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
          echo "Nx affected base=$BASE head=HEAD"

      # lint：前端无 nx lint target，保持根 pnpm lint 整跑（apps/web + libs/ts，ESLint 很快）。
      - name: Lint (ESLint)
        run: pnpm lint

      # 受影响前端包只跑 typecheck/build（含其依赖的 build）。
      # --exclude='*,!tag:lang:ts'：只保留 tag lang:ts 的项目（web、libs/ts/*），排除 Go（api/libs-go）与 contracts，
      # 避免前端 job 误跑 Go 项目的 build（且 api 的 build 在 go.work 根下会失败，属 R1 project.json 范畴，本 job 不碰）。
      - name: Affected typecheck + build (Nx, TS only)
        run: |
          pnpm exec nx affected -t typecheck build \
            --base="$NX_BASE" --head="$NX_HEAD" \
            --exclude='*,!tag:lang:ts' \
            --output-style=static

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l apps/api libs/go)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          (cd libs/go && go vet ./...)
          (cd apps/api && go vet ./...)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: libs/go
      - name: golangci-lint (demo)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: apps/api

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum

      - name: Init PostgreSQL schema
        env:
          PGPASSWORD: "123456"
        run: |
          psql -h 127.0.0.1 -U postgres -d demo -f tools/sql/table_init.sql

      # 依赖 DB/Redis 的用例已用 //go:build integration 标记，必须带 tag 才会执行，
      # 否则本 job 提供的 postgres/redis service 形同虚设。
      - name: Test pkg (unit + integration)
        run: cd libs/go && go test -race -tags=integration ./...
      - name: Test demo (unit + integration)
        run: cd apps/api && go test -race -tags=integration ./...

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum

      - name: govulncheck
        env:
          # 锁定 govulncheck 版本，保证扫描结果可复现（不再用 @latest，避免上游版本漂移导致门禁时红时绿）。
          # v1.9.0 = 本次修复时本地实测通过的版本。升级需同步复核后改这里。
          GOVULNCHECK_VERSION: v1.9.0
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          (cd libs/go && govulncheck ./...)
          (cd apps/api && govulncheck ./...)

  e2e:
    name: E2E
    # 仅手动触发（workflow_dispatch）时运行；push/PR 自动触发不再跑 E2E（太慢）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # P1：读取根 package.json 的 packageManager（pnpm@12.10.1），单一事实源在仓库根。
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 与根 package.json 的 engines.node（>=26）对齐；Node 26 为当前 LTS。
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Init PostgreSQL schema
        env:
          PGPASSWORD: "123456"
        run: |
          psql -h 127.0.0.1 -U postgres -d demo -f tools/sql/table_init.sql

      # 后端真端口 e2e：用例内部用 testsetup + Routers 自起随机端口，不依赖外部进程
      - name: Backend e2e (real port)
        run: |
          go test -tags=e2e ./apps/api/e2e/... -v -count=1

      # 前端 Playwright 需要一个真实后端在 8099：构建二进制并后台启动
      - name: Build & start backend for frontend e2e
        run: |
          go build -o output/build/demo ./apps/api/cmd
          APP_CONFIG_PATH="$PWD/apps/api/config/config.yaml" ./output/build/demo > /tmp/demo_be.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8099/v1/demo/health >/dev/null; then echo "backend up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/v1/demo/health

      - name: Install frontend deps
        run: |
          # P3-T5：统一用 --frozen-lockfile（根 lockfile 已冻结，安装不可漂移；clean checkout 下 lockfile 与 package.json 一致）
          pnpm install --frozen-lockfile
          pnpm --filter @ark-go-starter/e2e exec playwright install --with-deps chromium

      - name: Frontend lint (ESLint)
        run: pnpm lint

      - name: Frontend e2e (Playwright)
        env:
          E2E_WEB_MODE: preview
        run: |
          cd tests/e2e
          pnpm exec playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/demo_be.log || true
