name: CI

# ─────────────────────────────────────────────────────────────────────────────
# 门禁原则（2026-11 定稿）：
#   1) PR 门禁只做「判定」：lint / typecheck / test / 安全扫描。
#      不产出产物（vite build、go build、docker build），不现装工具（go install / npx）。
#   2) 判定所需的「编译」不可避免（go test / golangci-lint / govulncheck 都要先编译），
#      其重复成本靠构建缓存消除：PR 侧只 restore，save 只在 main push / 手动 dispatch。
#   3) 合并后主干仍跑全量验证（四个 required job 一个不少）。
#
# 缓存为什么必须自己做（2026-11-13 实测）：
#   actions/setup-go 的 key 只由 go.work.sum hash 决定，命中即 "not saving cache"，
#   首次保存的残缺快照（164MB / 5060 文件）被永久复用；一份完整的 GOCACHE 是
#   2.6GB / 22447 文件。实测 go vet：现状 93.6s、无缓存 161s、显式缓存命中 0.89s。
#   故这里用 actions/cache 自行管理，并用 GO_CACHE_VERSION 作为手动失效开关。
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]
  # merge queue 预留：仓库开启 merge queue 后由队列触发，无需再改本文件。
  merge_group:
  # E2E job 最慢（后端真端口 + Playwright），仅在手动触发且显式勾选 run_e2e 时运行。
  # 这样手动 dispatch 也可以只跑常规门禁（例如预热/验证构建缓存）。
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "同时运行 E2E（后端真端口 + Playwright，约 10-25 分钟）"
        type: boolean
        default: false

permissions:
  contents: read

# 同一 PR 连推多个 commit 时取消旧 run，避免重复消耗；main push 不取消（要留完整记录）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 与 apps/api/config/config.yaml 中 db_configs / redis_config 保持一致。
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  OAPI_CODEGEN_VERSION: v2.4.1
  # Go 缓存版本号：缓存命中后不再回写，需要强制刷新（依赖未变但缓存可疑）时把它 +1。
  GO_CACHE_VERSION: v1

jobs:
  frontend:
    name: Frontend
    # 硬约束：job id `frontend` / name `Frontend` 不变（分支保护 required check 依赖名字）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Nx affected 需要 base..head 的 git 历史（计算 merge-base / 变更文件），浅克隆不够。
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 契约校验只在真涉及契约面时跑（改 spec / 生成物），其余 PR 不再为此付 Go 工具链成本。
      - name: Detect contract-relevant changes
        id: contracts
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          else
            base="HEAD~1"
          fi
          if git diff --quiet "$base" HEAD -- contracts pkg/client packages/api-client; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "契约面无变更，跳过 contracts-verify"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "契约面有变更，将执行 contracts-verify"
          fi

      - name: Set up Go (contracts only)
        if: steps.contracts.outputs.relevant == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      # 工具二进制缓存：命中即零安装；未命中由 verify.sh 按 pin 版本自行 go install 兜底。
      - name: Cache oapi-codegen binary
        if: steps.contracts.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          path: ~/go/bin/oapi-codegen
          key: oapi-codegen-${{ env.OAPI_CODEGEN_VERSION }}

      - name: Contracts verify
        if: steps.contracts.outputs.relevant == 'true'
        run: make contracts-verify

      # lint：前端无 nx lint target，保持根 pnpm lint 整跑（apps/web + packages/*，ESLint 很快）。
      - name: Lint (ESLint)
        run: pnpm lint

      # 计算 Nx affected 的 base/head：PR 用 origin/<base_ref>，push/merge_group 用 HEAD~1。
      - name: Compute Nx affected base/head
        run: |
          base="${{ github.base_ref }}"
          if [ -n "$base" ]; then
            git fetch --no-tags origin "$base:refs/remotes/origin/$base" || true
            base="origin/$base"
          else
            base="HEAD~1"
          fi
          echo "NX_BASE=$base" >> "$GITHUB_ENV"
          echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
          echo "Nx affected base=$base head=HEAD"

      # 只跑 typecheck，不再跑 build：build 产出 dist 在门禁里无人消费；
      # packages/{ui,types,api,api-client} 的 build 与 typecheck 命令本就完全相同（重复 tsc）。
      # --exclude='*,!tag:lang:ts'：只保留前端项目，排除 Go（api/pkg）与 contracts。
      - name: Affected typecheck (Nx, TS only)
        run: |
          pnpm exec nx affected -t typecheck \
            --base="$NX_BASE" --head="$NX_HEAD" \
            --exclude='*,!tag:lang:ts' \
            --output-style=static

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false # 内置缓存是"命中即冻结"的残缺快照，改用下面的显式缓存

      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}
          restore-keys: |
            go-lint-${{ env.GO_CACHE_VERSION }}-

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l apps/api pkg)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt："
            echo "$unformatted"
            exit 1
          fi

      # 不再单独跑 `go vet`：.golangci.yml 已启用 govet linter，且 CI 在两个模块各跑一次；
      # 独立 vet 只是把编译成本重复付一遍（实测曾占 Lint job 的 146/189 秒）。
      - name: golangci-lint (pkg)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: pkg
      - name: golangci-lint (apps/api)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: apps/api

      - name: Save Go cache
        # 只有 main push / 手动 dispatch 回写；PR 只读，避免每个 PR 各写一份 2.6GB。
        if: >-
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
          && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Restore Go cache (race flavor)
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}
          restore-keys: |
            go-test-${{ env.GO_CACHE_VERSION }}-
            go-lint-${{ env.GO_CACHE_VERSION }}-

      - name: Init PostgreSQL schema
        env:
          PGPASSWORD: "123456"
        run: |
          psql -h 127.0.0.1 -U postgres -d demo -f apps/api/db/table_init.sql

      # 依赖 DB/Redis 的用例已用 //go:build integration 标记，必须带 tag 才会执行。
      # 两个模块保持串行：pkg 与 apps/api 的集成用例共用同一个 demo 库，并行可能互相污染。
      - name: Test pkg (unit + integration)
        run: cd pkg && go test -race -tags=integration ./...
      - name: Test demo (unit + integration)
        run: cd apps/api && go test -race -tags=integration ./...

      - name: Save Go cache (race flavor)
        if: >-
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
          && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ env.GO_CACHE_VERSION }}-${{ hashFiles('go.work.sum') }}
          restore-keys: |
            go-lint-${{ env.GO_CACHE_VERSION }}-

      # 锁定版本保证结果可复现；二进制走缓存，命中即零安装。
      - name: Cache govulncheck binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ env.GOVULNCHECK_VERSION }}

      - name: govulncheck
        run: |
          if ! command -v govulncheck >/dev/null 2>&1; then
            GOBIN="$HOME/go/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
            export PATH="$HOME/go/bin:$PATH"
          fi
          (cd pkg && govulncheck ./...)
          (cd apps/api && govulncheck ./...)

  e2e:
    name: E2E
    # 仅手动触发且勾选 run_e2e 时运行；push/PR 不跑 E2E（太慢）。
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Init PostgreSQL schema
        env:
          PGPASSWORD: "123456"
        run: |
          psql -h 127.0.0.1 -U postgres -d demo -f apps/api/db/table_init.sql

      # 后端真端口 e2e：用例内部用 testsetup + Routers 自起随机端口，不依赖外部进程
      - name: Backend e2e (real port)
        run: |
          go test -tags=e2e ./apps/api/e2e/... -v -count=1

      # 前端 Playwright 需要一个真实后端在 8099：构建二进制并后台启动
      # （E2E 是手动触发的发布前验证，允许产出构建物，不属于 PR 门禁范畴）
      - name: Build & start backend for frontend e2e
        run: |
          go build -o output/build/demo ./apps/api/cmd
          APP_CONFIG_PATH="$PWD/apps/api/config/config.yaml" ./output/build/demo > /tmp/demo_be.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8099/v1/demo/health >/dev/null; then echo "backend up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/v1/demo/health

      - name: Install frontend deps
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ark-go-starter/e2e exec playwright install --with-deps chromium

      - name: Frontend lint (ESLint)
        run: pnpm lint

      - name: Frontend e2e (Playwright)
        env:
          E2E_WEB_MODE: preview
        run: |
          cd tests/e2e
          pnpm exec playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/demo_be.log || true
