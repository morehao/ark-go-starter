name: CI

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]
  # E2E job 最慢（后端真端口 + Playwright，约数分钟），已从 push/PR 自动触发中移除，
  # 仅在此手动触发时运行（e2e job 带 if 门控）。日常 PR 不再等待 E2E。
  workflow_dispatch:

permissions:
  contents: read

env:
  # 与 apps/api/config/config.yaml 中 db_configs / redis_config 保持一致，
  # 供需要数据库的测试（pkg/dbclient、svcuser）使用。
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  frontend:
    name: Frontend
    # P05-T1：新增前端门禁（lint + typecheck + build），与既有 Lint/Test/Security/E2E 四 job 并列，
    # **不改**它们的 job id / name / 触发。路径过滤不在本 job 内做：顶层 on: 一旦加 paths 会把
    # 既有 4 个 job（含后端）一起门控，破坏其触发，故本 job 与其余 job 一样在全部分支 push/PR 上运行；
    # 过度触发由后续 P4-T3 的 `nx affected` 收敛（job 名保持不变）。
    # 依赖：P05-T3（R2）修通 pnpm typecheck/build；当前本仓 frontend 三脚本本地实测均通过（lint 0 error/7 warning）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # P1：前端 workspace 已上移到仓库根，单一事实源是根 package.json 的 packageManager（pnpm@12.10.1）
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          # P1：lockfile 已上移到根 pnpm-lock.yaml
          cache-dependency-path: pnpm-lock.yaml

      # P1/P2：workspace 根在仓库根，pnpm 命令在根目录执行（P2 后成员为 apps/web、libs/ts/*、tests/e2e）
      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l apps/api libs/go)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          (cd libs/go && go vet ./...)
          (cd apps/api && go vet ./...)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: libs/go
      - name: golangci-lint (demo)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: apps/api

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum

      - name: Init PostgreSQL schema
        env:
          PGPASSWORD: "123456"
        run: |
          psql -h 127.0.0.1 -U postgres -d demo -f tools/sql/table_init.sql

      # 依赖 DB/Redis 的用例已用 //go:build integration 标记，必须带 tag 才会执行，
      # 否则本 job 提供的 postgres/redis service 形同虚设。
      - name: Test pkg (unit + integration)
        run: cd libs/go && go test -race -tags=integration ./...
      - name: Test demo (unit + integration)
        run: cd apps/api && go test -race -tags=integration ./...

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum

      - name: govulncheck
        env:
          # 锁定 govulncheck 版本，保证扫描结果可复现（不再用 @latest，避免上游版本漂移导致门禁时红时绿）。
          # v1.9.0 = 本次修复时本地实测通过的版本。升级需同步复核后改这里。
          GOVULNCHECK_VERSION: v1.9.0
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          (cd libs/go && govulncheck ./...)
          (cd apps/api && govulncheck ./...)

  e2e:
    name: E2E
    # 仅手动触发（workflow_dispatch）时运行；push/PR 自动触发不再跑 E2E（太慢）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # P1：读取根 package.json 的 packageManager（pnpm@12.10.1），单一事实源在仓库根。
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 与根 package.json 的 engines.node（>=26）对齐；Node 26 为当前 LTS。
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Init PostgreSQL schema
        env:
          PGPASSWORD: "123456"
        run: |
          psql -h 127.0.0.1 -U postgres -d demo -f tools/sql/table_init.sql

      # 后端真端口 e2e：用例内部用 testsetup + Routers 自起随机端口，不依赖外部进程
      - name: Backend e2e (real port)
        run: |
          go test -tags=e2e ./apps/api/e2e/... -v -count=1

      # 前端 Playwright 需要一个真实后端在 8099：构建二进制并后台启动
      - name: Build & start backend for frontend e2e
        run: |
          go build -o output/build/demo ./apps/api/cmd
          APP_CONFIG_PATH="$PWD/apps/api/config/config.yaml" ./output/build/demo > /tmp/demo_be.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8099/v1/demo/health >/dev/null; then echo "backend up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/v1/demo/health

      - name: Install frontend deps
        run: |
          # P3-T5：统一用 --frozen-lockfile（根 lockfile 已冻结，安装不可漂移；clean checkout 下 lockfile 与 package.json 一致）
          pnpm install --frozen-lockfile
          pnpm --filter @ark-go-starter/e2e exec playwright install --with-deps chromium

      - name: Frontend lint (ESLint)
        run: pnpm lint

      - name: Frontend e2e (Playwright)
        env:
          E2E_WEB_MODE: preview
        run: |
          cd tests/e2e
          pnpm exec playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/demo_be.log || true
