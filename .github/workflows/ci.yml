name: CI

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]

permissions:
  contents: read

env:
  # 与 backend/apps/demo/config/config.yaml 中 db_configs / redis_config 保持一致，
  # 供需要数据库的测试（pkg/dbclient、svcuser）使用。
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/pkg/go.mod
          cache-dependency-path: |
            backend/go.work.sum

      - name: gofmt check
        run: |
          cd backend
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          cd backend
          (cd pkg && go vet ./...)
          (cd apps/demo && go vet ./...)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend/pkg
      - name: golangci-lint (demo)
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend/apps/demo

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/pkg/go.mod
          cache-dependency-path: |
            backend/go.work.sum

      - name: Init PostgreSQL schema
        env:
          PGPASSWORD: "123456"
        run: |
          psql -h 127.0.0.1 -U postgres -d demo -f backend/scripts/sql/table_init.sql

      # 依赖 DB/Redis 的用例已用 //go:build integration 标记，必须带 tag 才会执行，
      # 否则本 job 提供的 postgres/redis service 形同虚设。
      - name: Test pkg (unit + integration)
        run: cd backend/pkg && go test -race -tags=integration ./...
      - name: Test demo (unit + integration)
        run: cd backend/apps/demo && go test -race -tags=integration ./...

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/pkg/go.mod
          cache-dependency-path: |
            backend/go.work.sum

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend
          (cd pkg && govulncheck ./...)
          (cd apps/demo && govulncheck ./...)
