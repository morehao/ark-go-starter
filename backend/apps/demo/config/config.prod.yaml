server:
  name: demo
  port: 8099
  env: prod

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    logger_type: zap
    service: demo
    module: default
    level: info
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  gorm:
    logger_type: zap
    service: demo
    module: gorm
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  redis:
    logger_type: zap
    service: demo
    module: redis
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId


db_configs:
  # 目标库为 PostgreSQL（model tag 与 backend/scripts/sql/table_init.sql 都按 PG 写）
  - url: "postgres://postgres:123456@127.0.0.1:5432/demo?sslmode=disable&TimeZone=Asia/Shanghai"
    service: demo

redis_config:
  service: demo
  addr: 127.0.0.1:6379
  password: 123456
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

file_storage:
  driver: local
  bucket: demo
  storage:
    base_dir: /app/storage
    # 必须指向 ginupload 注册的对象直传路由（/v1/demo/objects），
    # local driver 按 base_url/{bucket}/{key} 拼预签名 URL
    base_url: http://127.0.0.1:8099/v1/demo/objects
    sign_secret: demo-sign-secret

# 可选内嵌 ark-iam（形态 2）。生产环境（env: prod）务必显式配置以下安全项，否则 iam.New 会
# fail-closed 启动失败（见 ark-iam validateNonDevSecurityConfig）：
#   - signing_key：OIDC 签名私钥 PEM（RSA/EC），用于签发 id_token / 验签；
#   - encryption_key：会话/令牌加密密钥（≥32 字节随机串）；
#   - cookie_secure：SSO 会话 cookie 的 Secure 标志，HTTPS 生产必须 true。
# enable 置 true 才真正挂载 /iam/* 并对业务接口启用 OIDC 鉴权；置 false 时这一段仅作占位，
# 零副作用（不建表、不挂路由、业务鉴权回落为「无身份」）。下方占位值务必替换为真实密钥，
# 切勿把真实私钥提交入库（建议改用环境变量/密钥管理，运行时由部署系统注入）。
iam:
  enable: false               # 是否启用内嵌 IAM（生产按需开启）
  prefix: /iam                # IAM 挂载路由前缀（须与前端 basePath 一致）
  dsn: ""                     # IAM 数据库 DSN，空则复用 db_configs 第一个库
  redis_addr: ""              # IAM Redis 地址，空则复用 redis_config
  redis_password: ""          # IAM Redis 密码，空则复用 redis_config
  issuer: ""                  # OIDC issuer，空则按端口推导；生产建议显式设为对外域名（https）
  signing_key: "REPLACE_WITH_PEM_PRIVATE_KEY"   # 签名私钥 PEM，非 dev 必填
  encryption_key: "REPLACE_WITH_32_BYTE_RANDOM_SECRET"  # 加密密钥，非 dev 必填
  cookie_secure: true         # 生产（HTTPS）必须 true
