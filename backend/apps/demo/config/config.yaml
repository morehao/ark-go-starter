server:
  name: demo
  port: 8099
  env: dev

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    logger_type: zap
    service: demo
    module: default
    level: info
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  gorm:
    logger_type: zap
    service: demo
    module: gorm
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  redis:
    logger_type: zap
    service: demo
    module: redis
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId

trace:
  enable: false
  service_version: ""
  sampler: traceidratio
  trace_id_ratio: 1.0
  otlp:
    endpoint: "127.0.0.1:4317"
    insecure: true
    timeout: 10s


db_configs:
  # 目标库为 PostgreSQL（model tag 与 backend/scripts/sql/table_init.sql 都按 PG 写）
  - url: "postgres://postgres:123456@127.0.0.1:5432/demo?sslmode=disable&TimeZone=Asia/Shanghai"
    service: demo
    # 连接池：显式配置，避免默认无上限导致连接耗尽（golib dbgorm 按 >0 才下发）。
    max_idle_conns: 10
    max_open_conns: 100
    conn_max_lifetime: 1h

redis_config:
  service: demo
  addr: 127.0.0.1:6379
  password: 123456
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

file_storage:
  driver: local
  bucket: demo
  storage:
    base_dir: ../../../storage
    # 必须指向 ginupload 注册的对象直传路由（/v1/demo/objects），
    # local driver 按 base_url/{bucket}/{key} 拼预签名 URL
    base_url: http://127.0.0.1:8099/v1/demo/objects
    sign_secret: demo-sign-secret

cron:
  enable_lock: true       # 是否启用分布式锁（多实例互斥）
  lock_ttl: 60s           # 分布式锁租期

async:
  redis_addr: 127.0.0.1:6379  # Redis 地址
  redis_password: "123456"    # Redis 密码
  redis_db: 0                 # Redis 库号

# 可选内嵌 ark-iam（形态 2）。默认关闭：不初始化 IAM、不建表、不挂 /iam/* 路由，
# 业务鉴权回落到固定 dev 身份（仅 dev）。打开后本进程即 IAM，业务接口全部走 OIDC 鉴权。
iam:
  enable: false               # 是否启用内嵌 IAM（默认 false）
  prefix: /iam                # IAM 挂载路由前缀（须与前端 basePath 一致）
  dsn: ""                     # IAM 数据库 DSN，空则复用 db_configs 第一个库
  redis_addr: ""              # IAM Redis 地址，空则复用 redis_config
  redis_password: ""          # IAM Redis 密码，空则复用 redis_config
  issuer: ""                  # OIDC issuer，空则按端口推导
  signing_key: ""             # 签名私钥 PEM，非 dev 必填
  encryption_key: ""          # 加密密钥，非 dev 必填
  cookie_secure: false        # SSO cookie Secure，生产（HTTPS）必须 true
