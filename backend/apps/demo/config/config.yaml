server:
  name: demo
  port: 8099
  env: dev

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    logger_type: zap
    service: demo
    module: default
    level: info
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  gorm:
    logger_type: zap
    service: demo
    module: gorm
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId
  redis:
    logger_type: zap
    service: demo
    module: redis
    level: debug
    writers:
      - type: console
      - type: file
        dir: ../../../log
    extra_keys:
      - requestId

trace:
  enable: false
  service_version: ""
  sampler: traceidratio
  trace_id_ratio: 1.0
  otlp:
    endpoint: "127.0.0.1:4317"
    insecure: true
    timeout: 10s


db_configs:
  # 目标库为 PostgreSQL（model tag 与 backend/scripts/sql/table_init.sql 都按 PG 写）
  - url: "postgres://postgres:123456@127.0.0.1:5432/demo?sslmode=disable&TimeZone=Asia/Shanghai"
    service: demo
    # 连接池：显式配置，避免默认无上限导致连接耗尽（golib dbgorm 按 >0 才下发）。
    max_idle_conns: 10
    max_open_conns: 100
    conn_max_lifetime: 1h

redis_config:
  service: demo
  addr: 127.0.0.1:6379
  password: 123456
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

file_storage:
  driver: local
  bucket: demo
  storage:
    base_dir: ../../../storage
    # 必须指向 ginupload 注册的对象直传路由（/v1/demo/objects），
    # local driver 按 base_url/{bucket}/{key} 拼预签名 URL
    base_url: http://127.0.0.1:8099/v1/demo/objects
    sign_secret: demo-sign-secret

cron:
  enable_lock: true       # 是否启用分布式锁（多实例互斥）
  lock_ttl: 60s           # 分布式锁租期

async:
  redis_addr: 127.0.0.1:6379  # Redis 地址
  redis_password: "123456"    # Redis 密码
  redis_db: 0                 # Redis 库号

# 可选接入 ark-iam（三态 mode）。默认 disabled：不初始化 IAM、不建表、不挂 /iam/* 路由，
# 业务鉴权回落到固定 dev 身份（仅 dev）。
#   mode: disabled  不接入（默认，零副作用）
#   mode: op        本进程内嵌 OIDC Provider：建库、挂 /iam/*、签发/验签
#   mode: rp        对接外部 ark-iam：仅本地验签（读 jwks_url/audience），不建库、不挂路由
# 兼容旧开关：mode 留空且 enable: true 时按 op 处理（enable 已废弃，建议改用 mode）。
iam:
  mode: disabled              # 接入形态：disabled（默认）| op | rp
  enable: false               # 旧二态开关（兼容）：mode 为空且为 true 时按 op
  prefix: /iam                # IAM 挂载路由前缀（op 须与前端 basePath 一致）
  dsn: ""                     # IAM 数据库 DSN（op），空则复用 db_configs 第一个库
  redis_addr: ""              # IAM Redis 地址（op），空则复用 redis_config
  redis_password: ""          # IAM Redis 密码（op），空则复用 redis_config
  issuer: ""                  # OIDC issuer：op 空则按端口推导；rp 为外部 ark-iam 的 issuer
  jwks_url: ""                # rp 形态的 JWKS 端点，空则按 issuer 推导
  audience: ""                # rp 形态需校验的 token aud
  signing_key: ""             # 签名私钥 PEM（op），非 dev 必填
  encryption_key: ""          # 加密密钥（op），非 dev 必填
  cookie_secure: false        # SSO cookie Secure（op），生产（HTTPS）必须 true
