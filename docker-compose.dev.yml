# ============================================================================
# 本地开发依赖编排（仅 dev，供 scripts/quickstart.sh 使用）
#
# 只用一条命令把 PG / Redis 起起来：`docker compose -f docker-compose.dev.yml up -d`
# （`make quickstart` 会自动调用，你通常不用手敲）。
#
# 端口与密码**必须**与 backend/apps/demo/config/config.yaml 对齐：
#   - PG:    postgres://postgres:123456@127.0.0.1:5432/demo
#   - Redis: 127.0.0.1:6379（无密码）
#
# 若本机 5432 / 6379 已被占用（例如已有本地 PG/Redis），quickstart 会探测到端口占用并
# 自动降级为「复用外部依赖」（等价 `make quickstart-local`），不会强行起容器。
#
# 注意：这是**开发用**配置，密码为明文弱口令，切勿用于任何生产环境。
# ============================================================================
services:
  postgres:
    image: postgres:16
    container_name: ark-go-starter-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 就绪才让 quickstart 继续建库建表
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ark-go-starter-redis
    ports:
      - "6379:6379"
    # 无密码（与 config.yaml 的 redis_config.password 为空一致）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata_dev:
    name: ark-go-starter-pgdata-dev
